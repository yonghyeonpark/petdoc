spring:
  datasource:
    url: jdbc:h2:mem:testdb;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        jdbc:
          batch_size: 1
    defer-datasource-initialization: true

  docker:
    compose:
      enabled: false

  sql:
    init:
      mode: always